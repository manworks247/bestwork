    .stage-area {

    .exact-slide-img {

<body>

  <header class="topbar">
    <div class="brand-group">
      <span class="ppt-badge">IIIT DHARWAD • PPTX</span>
      <div>
        <div class="deck-title">The "Zenith-V" EV Scooter Launch — Managerial Economics (Sessions 1–9)</div>
        <div class="deck-subtitle">Submitted to: Dr. K. T. Deepak (Associate Dean, IIIT Dharwad) &nbsp;•&nbsp; E-Mobility India Case Study</div>
      </div>
    </div>

    <div class="student-pill-top">
      🎓 J GANESH KUMAR REDDY &nbsp;|&nbsp; 23BDS024
    </div>

    <div class="toolbar-actions">
      <a class="btn-download btn-pptx" href="/download/Zenith_V_EV_Scooter_Launch_J_GANESH_KUMAR_REDDY_23BDS024.pptx" download>
        ⬇ Download .PPTX
      </a>
      <a class="btn-download btn-pdf" href="/download/Zenith_V_EV_Scooter_Launch_J_GANESH_KUMAR_REDDY_23BDS024.pdf" download>
        ⬇ Download .PDF
      </a>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebarList"></aside>

    <main class="stage-area">
      <div class="slide-viewport" id="slideViewport"></div>

      <div class="bottom-controls">
        <div class="nav-btns">
          <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">◀ Previous Slide</button>
          <span id="slideCounter" style="font-size: 13px; font-weight: 700; padding: 0 8px;">Slide 1 of 7</span>
          <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">Next Slide ▶</button>
        </div>
        <div class="notes-preview" id="speakerNotesBar"></div>
        <div style="font-size: 12px; font-weight: 700; color: #38bdf8;">
          J GANESH KUMAR REDDY 23BDS024
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentSlide = 1;
    const cacheBust = Date.now();

    const slidesMeta = [
      {
        num: 1,
        title: "Slide 1: Title Slide",
        notes: "Slide 1: Title Slide — J GANESH KUMAR REDDY 23BDS024 | Submitted to Dr. K. T. Deepak, IIIT Dharwad."
      },
      {
        num: 2,
        title: "Slide 2: Market Structure Analysis",
        notes: "Slide 2 (Session 4 Market DNA): Oligopoly structure (Ola, TVS, Bajaj, Ather = 83% share) with 4 key characteristics."
      },
      {
        num: 3,
        title: "Slide 3: Demand & Elasticity Analysis",
        notes: "Slide 3 (Session 2 Demand Shift & Elasticity): Cross-Price Elasticity of Demand (Exy > 0 for petrol; Exy < 0 for complements)."
      },
      {
        num: 4,
        title: "Slide 4: Recommended Pricing Strategy",
        notes: "Slide 4 (Sessions 5 & 6): Penetration Pricing at ₹79,999, Break-Even Point (1,00,000 units where TR = TC), and Margin of Safety."
      },
      {
        num: 5,
        title: "Slide 5: Competitor Response & Game Theory",
        notes: "Slide 5 (Session 7 Game Theory): Strategic Interdependence (Reliance Jio parallel), Kinked Demand Curve & Nash Equilibrium."
      },
      {
        num: 6,
        title: "Slide 6: Capital Budgeting (NPV, IRR, Risk)",
        notes: "Slide 6 (Sessions 8 & 9): NPV = +₹50 Cr @ 15% proves IRR > 15% (~23.0%); Measurable Risk vs. Unmeasurable Uncertainty."
      },
      {
        num: 7,
        title: "Slide 7: Final Recommendation & Conclusion",
        notes: "Slide 7: Final Executive Synthesis across Sessions 1–9 — J GANESH KUMAR REDDY 23BDS024."
      }
    ];

    function renderSidebar() {
      const container = document.getElementById('sidebarList');
      let html = `<div class="sidebar-header">7 Assignment Slides</div>`;
      slidesMeta.forEach(s => {
        const activeCls = s.num === currentSlide ? 'active' : '';
        html += `
          <div class="thumb-item ${activeCls}" onclick="goToSlide(${s.num})">
            <div class="thumb-top">
              <span class="thumb-num">SLIDE 0${s.num}</span>
              <span style="font-size:10px; color:#38bdf8; font-weight:700;">23BDS024</span>
            </div>
            <div class="thumb-title">${s.title}</div>
            <img class="thumb-img" src="/assets/slides_preview/slide_${s.num}.png?v=${cacheBust}" alt="Slide ${s.num}" />
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderStage() {
      const viewport = document.getElementById('slideViewport');
      const s = slidesMeta[currentSlide - 1];
      viewport.innerHTML = `<img class="exact-slide-img" src="/assets/slides_preview/slide_${currentSlide}.png?v=${cacheBust}" alt="Slide ${currentSlide}" />`;
      document.getElementById('slideCounter').textContent = `Slide ${currentSlide} of 7`;
      document.getElementById('speakerNotesBar').textContent = s.notes;
      document.getElementById('prevBtn').disabled = currentSlide === 1;
      document.getElementById('nextBtn').disabled = currentSlide === 7;
      renderSidebar();
    }

    function goToSlide(num) {
      currentSlide = num;
      renderStage();
    }

    function changeSlide(delta) {
      const next = currentSlide + delta;
      if (next >= 1 && next <= 7) {
        currentSlide = next;
        renderStage();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') changeSlide(1);
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') changeSlide(-1);
    });

    renderStage();
  </script>
</body>
